server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|webp|avif|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA-style fallback for Hugo pretty URLs
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Custom 404
    error_page 404 /404.html;
}
