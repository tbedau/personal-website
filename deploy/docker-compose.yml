services:
  personal-website:
    image: nginx:alpine
    container_name: personal-website
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.personal-website.rule=Host(`tillmannbedau.com`)"
      - "traefik.http.routers.personal-website.entrypoints=websecure"
      - "traefik.http.routers.personal-website.tls=true"
      - "traefik.http.routers.personal-website.middlewares=security-headers@file"
      - "traefik.http.services.personal-website.loadbalancer.server.port=80"
    networks:
      - traefik-public
    restart: unless-stopped

networks:
  traefik-public:
    external: true
