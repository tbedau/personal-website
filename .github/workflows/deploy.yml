name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restore audio cache
        uses: actions/cache@v4
        with:
          path: static/audio
          key: audio-v1-${{ hashFiles('content/blog/**/*.md') }}
          restore-keys: audio-v1-

      # Audio is optional: a TTS outage or exhausted credits must not block
      # a deploy. Posts without a generated file still build fine; commit
      # generated MP3s under static/audio/ to keep them permanently.
      - name: Generate audio
        continue-on-error: true
        env:
          INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
        run: uv run scripts/generate-audio.py

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - run: hugo --minify

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
