name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restore audio cache
        uses: actions/cache@v4
        with:
          path: static/audio
          key: audio-v1-${{ hashFiles('content/blog/**/*.md') }}
          restore-keys: audio-v1-

      - name: Generate audio
        env:
          INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
        run: uv run scripts/generate-audio.py

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - run: hugo --minify

      # Join the tailnet so we can SSH to the VPS (public SSH is closed).
      # Uses an OAuth client (which does not expire) to mint a short-lived,
      # ephemeral, tag:ci auth key on each run, so the runner auto-disappears
      # from the tailnet when the job ends.
      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: public/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
